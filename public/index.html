<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <!-- Ekstraktor PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Ekstraktor Teks Gambar (OCR) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { background-color: #ffffff; color: #000000; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .prose p { margin-bottom: 0.65rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre { background: #f4f4f5; border: 1px solid #000000; border-radius: 4px; padding: 0.75rem; margin: 0.75rem 0; overflow-x: auto; }
    .prose code { font-family: monospace; font-size: 0.85rem; }
    .prose ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
    .prose ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
    @keyframes recording { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .recording-active { animation: recording 1s infinite; background-color: #000000 !important; color: #ffffff !important; }
  </style>
</head>
<body class="flex flex-col h-screen max-w-4xl mx-auto border-x border-black">

  <!-- Header -->
  <header class="h-14 border-b border-black flex items-center justify-between px-4 bg-white select-none shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-3 h-3 bg-black"></div>
      <h1 class="font-bold text-sm tracking-wider uppercase">Qwen AI Workspace</h1>
    </div>
    <button id="clear-btn" type="button" class="text-xs uppercase font-bold border border-black px-2.5 py-1 hover:bg-black hover:text-white transition">
      Reset Chat
    </button>
  </header>

  <!-- Area Pesan -->
  <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
    <div id="empty-state" class="text-center py-16">
      <p class="text-sm font-semibold uppercase tracking-wider text-neutral-400">Siap Digunakan</p>
      <p class="text-xs text-neutral-500 mt-1">Ketik pesan, rekam suara via mic, atau upload file PDF / gambar.</p>
    </div>
  </div>

  <!-- Indikator Loading File OCR / PDF -->
  <div id="file-processing-bar" class="hidden px-4 py-2 border-t border-black bg-neutral-100 text-xs font-mono flex items-center justify-between">
    <span id="processing-status">Mengekstrak teks...</span>
    <span class="animate-pulse">Loading...</span>
  </div>

  <!-- Chip File Terlampir -->
  <div id="attachment-chip" class="hidden px-4 py-2 border-t border-black bg-neutral-50 text-xs flex items-center justify-between">
    <div class="flex items-center gap-2 overflow-hidden">
      <span class="font-bold uppercase">[File Terlampir]</span>
      <span id="attachment-name" class="font-mono truncate max-w-xs md:max-w-md"></span>
    </div>
    <button id="remove-attachment-btn" type="button" class="text-xs font-bold uppercase underline hover:text-neutral-600">
      Hapus
    </button>
  </div>

  <!-- Footer Input -->
  <footer class="p-3 border-t border-black bg-white shrink-0">
    <form id="chat-form" class="flex items-end gap-2">
      
      <!-- Upload File / Gambar -->
      <label class="p-2 border border-black cursor-pointer hover:bg-neutral-100 transition shrink-0" title="Lampirkan File / Foto">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
        </svg>
        <input type="file" id="file-input" accept=".txt,.pdf,.md,.json,.png,.jpg,.jpeg,.webp" class="hidden">
      </label>

      <!-- Mic (Voice to Text) -->
      <button type="button" id="mic-btn" class="p-2 border border-black hover:bg-neutral-100 transition shrink-0" title="Voice Input">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
      </button>

      <!-- Input Text -->
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ketik pesan..."
        class="flex-1 border border-black p-2 text-sm resize-none focus:outline-none max-h-36 overflow-y-auto"
      ></textarea>

      <!-- Tombol Kirim -->
      <button
        type="submit"
        id="send-btn"
        class="px-4 py-2 bg-black text-white text-sm font-bold uppercase hover:bg-neutral-800 disabled:opacity-40 disabled:cursor-not-allowed transition shrink-0"
      >
        Kirim
      </button>
    </form>
  </footer>

  <script src="app.js"></script>
</body>
</html>
